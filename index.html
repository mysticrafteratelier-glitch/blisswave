<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL = 'https://acqluzxchywrromkrrio.supabase.co';
const SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFjcWx1enhjaHl3cm9ybWtyamlvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MDU5NTc2MDAsImV4cCI6MTg2MzcxNzYwMH0.vKs6bKm5qg8xZhSl9v1tVcLZX9YvJhHNEJuEqzxNxEg';
const sb = window.supabase.createClient(SB_URL, SB_ANON);

let state = {
  products: [],
  categories: [],
  settings: {},
  filter: 'all',
  cart: [],
  selectedColor: {},
  selectedSize: {}
};

async function initStore() {
  try {
    const [{ data: prod }, { data: cat }, { data: sets }] = await Promise.all([
      sb.from('products').select('*').gt('stock', 0).order('created_at', { ascending: false }),
      sb.from('categories').select('*'),
      sb.from('settings').select('*')
    ]);
    state.products = prod || [];
    state.categories = cat || [];
    (sets || []).forEach(s => state.settings[s.key] = s.value);
    applyStoreStatus();
    renderFilters();
    renderProducts();
  } catch (e) {
    console.error('Error cargando tienda:', e);
  }
}

function isStoreClosed() {
  return state.settings?.store_status?.abierta === false;
}
function storeClosedMsg() {
  return state.settings?.store_status?.mensaje ||
    'Estamos actualizando el inventario 🌸 Vuelve en un ratito.';
}
// 🆕 ¿El admin activó "mostrar solo New Arrivals"?
function soloNewArrivals() {
  return state.settings?.store_status?.solo_new_arrivals === true;
}
function applyStoreStatus() {
  const closed = isStoreClosed();
  const heading = document.getElementById('catalogo');
  const filters = document.querySelector('.filters-zone');
  const catalog = document.querySelector('.catalog');
  const sections = [heading, filters, catalog];

  let view = document.getElementById('storeClosedView');

  if (closed) {
    sections.forEach(s => { if(s) s.style.display = 'none'; });
    if (view) {
      view.classList.add('active');
      document.getElementById('closedTitle').textContent = 'Tienda cerrada';
      document.getElementById('closedMsg').textContent = storeClosedMsg();
    }
    document.getElementById('mainContent').style.display = 'none';
  } else {
    sections.forEach(s => { if(s) s.style.display = ''; });
    if (view) view.classList.remove('active');
    document.getElementById('mainContent').style.display = 'block';
  }
}

function renderFilters() {
  const used = new Set(state.products.map(p => p.category_id).filter(Boolean));
  const cats = state.categories.filter(c => used.has(c.id));
  const chips = document.querySelector('.filter-chips');
  chips.innerHTML = `<button class="chip ${state.filter==='all'?'active':''}\" data-cat=\"all\">Todas</button>` +
    cats.map(c => `<button class="chip ${state.filter===c.id?'active':''}\" data-cat=\"${c.id}\">${escapeHtml(c.name)}</button>`).join('');
  
  [...chips.querySelectorAll('.chip')].forEach(b => {
    b.addEventListener('click', () => {
      state.filter = b.dataset.cat === 'all' ? 'all' : Number(b.dataset.cat);
      [...chips.querySelectorAll('.chip')].forEach(c => c.classList.remove('active'));
      b.classList.add('active');
      renderProducts();
    });
  });
}

function renderProducts() {
  const q = (document.getElementById('searchInput')?.value || '').toLowerCase().trim();
  let list = state.products;
  // 🆕 Si el admin activó "solo New Arrivals", mostrar únicamente esos
  if (soloNewArrivals()) list = list.filter(p => p.is_new_arrival === true);
  if (state.filter !== 'all') list = list.filter(p => p.category_id === state.filter);
  if (q) list = list.filter(p =>
    (p.name||'').toLowerCase().includes(q) ||
    (p.sku||'').toLowerCase().includes(q) ||
    (p.description||'').toLowerCase().includes(q)
  );
  document.getElementById('catalogCount').textContent = `${list.length} pieza${list.length !== 1 ? 's' : ''} disponible${list.length !== 1 ? 's' : ''}`;
  if (!list.length) {
    document.getElementById('productGrid').innerHTML = `<div class="empty"><div class="empty-icon">🔍</div><div class="empty-title">No encontramos nada</div><div class="empty-text">Prueba otra búsqueda</div></div>`;
    return;
  }
  document.getElementById('productGrid').innerHTML = list.map(p => {
    const stock = p.stock || 0;
    let badge = '';
    if (p.is_new_arrival) badge = `<span class="product-badge">✨ Nuevo</span>`;
    else if (stock <= 3) badge = `<span class="product-badge">Últimas ${stock}</span>`;
    const img = p.photo_url
      ? `<img class="product-img lazy-img" src="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%3E%3C/svg%3E" data-src="${escapeHtml(p.photo_url)}" alt="${escapeHtml(p.name)}" loading="lazy" decoding="async">`
      : `<div class="product-no-img"><div class="product-no-img-logo"></div></div>`;
    const videoIcon = p.video_url 
      ? `<div class="product-video-icon" title="Tiene video">▶</div>` 
      : '';
    const photoCount = 1 + (Array.isArray(p.extra_photos) ? p.extra_photos.filter(u => u).length : 0);
    const multiPhotoIcon = (photoCount > 1 && p.photo_url) 
      ? `<div class="product-multi-photo">📷 ${photoCount}</div>` 
      : '';
    return `
      <div class="product-card" onclick="openProductDetail(${p.id})">
        <div class="product-img-container">
          ${img}
          ${badge}
          ${videoIcon}
          ${multiPhotoIcon}
        </div>
        <div class="product-info">
          <div class="product-name">${escapeHtml(p.name || p.sku)}</div>
          <div class="product-sku">${escapeHtml(p.sku)}</div>
          <div class="product-price">$${(parseFloat(p.retail_price) || 0).toFixed(2)}</div>
        </div>
      </div>
    `;
  }).join('');
  lazyLoadImages();
}

function lazyLoadImages() {
  const images = document.querySelectorAll('.lazy-img');
  if ('IntersectionObserver' in window) {
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const img = entry.target;
          img.src = img.dataset.src;
          img.classList.remove('lazy-img');
          observer.unobserve(img);
        }
      });
    });
    images.forEach(img => observer.observe(img));
  } else {
    images.forEach(img => img.src = img.dataset.src);
  }
}

function openProductDetail(id) {
  const p = state.products.find(x => x.id === id);
  if (!p) return;
  
  const psku = (p.sku || '').toUpperCase();
  const allPhotos = [p.photo_url, ...(Array.isArray(p.extra_photos) ? p.extra_photos.filter(u => u) : [])].filter(u => u);
  
  let colorVariants = {};
  if (p.color_variants && typeof p.color_variants === 'object') {
    colorVariants = p.color_variants;
  }
  
  const hasColors = Object.keys(colorVariants).length > 0;
  const hasSizes = p.sizes && typeof p.sizes === 'object' && Object.keys(p.sizes).length > 0;
  
  const stock = p.stock || 0;
  const stockHtml = stock > 0 
    ? `<div class="product-detail-stock">✓ En stock (${stock})</div>`
    : `<div class="product-detail-stock out">✗ Sin stock</div>`;
  
  let colorSelectorHtml = '';
  if (hasColors) {
    const colorOpts = Object.entries(colorVariants).map(([color, data]) => {
      const cStock = (data.stock || 0);
      const disabled = cStock <= 0 ? 'unavailable' : '';
      return `<button class="color-option ${disabled}" onclick="selectColor('${psku}', '${color}')" title="${color}" style="background: linear-gradient(135deg, ${data.color_hex || '#ccc'}, ${data.color_hex || '#ccc'});"></button>`;
    }).join('');
    colorSelectorHtml = `
      <div class="color-selector">
        <label>Color</label>
        <div class="color-options">${colorOpts}</div>
      </div>
    `;
  }
  
  let sizeSelectorHtml = '';
  if (hasSizes) {
    const sizeOpts = Object.entries(p.sizes).map(([size, qty]) => {
      const disabled = (parseInt(qty) || 0) <= 0 ? 'unavailable' : '';
      return `<button class="size-option ${disabled}" onclick="selectSize('${psku}', '${size}')">${escapeHtml(size)}</button>`;
    }).join('');
    sizeSelectorHtml = `
      <div class="size-selector">
        <label>Talla</label>
        <div class="size-options">${sizeOpts}</div>
      </div>
    `;
  }
  
  const galleryDots = allPhotos.map((_, i) => `<button class="detail-gallery-
detail-gallery-dot ${i === 0 ? 'active' : ''}" onclick="changeDetailGallery(${id}, ${i})">`).join('');
  
  const detailHtml = `
    
      
        
      
      
        ${allPhotos.map(photo => ``).join('')}
        ${allPhotos.length > 1 ? `` : ''}
      
      
        
        
        
        ${stockHtml}
        ${p.description ? `` : ''}
        
        ${colorSelectorHtml}
        ${sizeSelectorHtml}
        
        
        
        
        
      
    
  `;
  
  document.getElementById('productDetailContent').innerHTML = detailHtml;
  document.getElementById('productDetailModal').classList.add('active');
}

function changeDetailGallery(pid, idx) {
  const imgs = document.querySelectorAll('#productDetailContent .product-detail-img');
  const dots = document.querySelectorAll('.detail-gallery-dot');
  imgs.forEach((img, i) => img.style.display = i === idx ? 'block' : 'none');
  dots.forEach((dot, i) => dot.classList.toggle('active', i === idx));
}

function closeProductDetail() {
  document.getElementById('productDetailModal').classList.remove('active');
}

function increaseQty(pid) {
  const input = document.getElementById('detailQty');
  input.value = (parseInt(input.value) || 1) + 1;
}

function decreaseQty(pid) {
  const input = document.getElementById('detailQty');
  const val = Math.max(1, (parseInt(input.value) || 1) - 1);
  input.value = val;
}

function addToCart(productId) {
  const p = state.products.find(x => x.id === productId);
  if (!p) return;
  
  const qty = parseInt(document.getElementById('detailQty')?.value) || 1;
  if (qty <= 0) { alert('Cantidad debe ser mayor que 0'); return; }
  
  const color = state.selectedColor[productId] || null;
  const size = state.selectedSize[productId] || null;
  
  const cartItem = {
    product_id: p.id,
    sku: p.sku,
    name: p.name || p.sku,
    photo_url: p.photo_url,
    unit_price: parseFloat(p.retail_price) || 0,
    qty: qty,
    color: color,
    size: size
  };
  
  state.cart.push(cartItem);
  updateCartCount();
  alert(`✓ Agregado al carrito`);
  closeProductDetail();
}

function updateCartCount() {
  const count = state.cart.length;
  const badge = document.querySelector('.cart-count');
  if (count > 0) {
    if (!badge) {
      const newBadge = document.createElement('span');
      newBadge.className = 'cart-count';
      newBadge.textContent = count;
      document.querySelector('.cart-fab').appendChild(newBadge);
    } else {
      badge.textContent = count;
    }
  } else if (badge) {
    badge.remove();
  }
}

function openCart() {
  renderCartItems();
  document.getElementById('cartModal').classList.add('active');
}

function closeCart() {
  document.getElementById('cartModal').classList.remove('active');
}

function removeFromCart(idx) {
  state.cart.splice(idx, 1);
  updateCartCount();
  renderCartItems();
}

function renderCartItems() {
  const container = document.getElementById('cartItems');
  if (state.cart.length === 0) {
    container.innerHTML = ``;
    document.querySelector('.checkout-btn').disabled = true;
    return;
  }
  
  let total = 0;
  container.innerHTML = state.cart.map((item, idx) => {
    const subtotal = item.qty * item.unit_price;
    total += subtotal;
    const colorSize = [item.color, item.size].filter(Boolean).join(', ');
    return `
      
          ${colorSize ? `` : ''}
          
          
        
      
    `;
  }).join('');
  
  document.getElementById('cartSubtotal').textContent = `$${total.toFixed(2)}`;
  document.getElementById('cartTotal').textContent = `$${total.toFixed(2)}`;
  document.querySelector('.checkout-btn').disabled = false;
}

function changeCartQty(idx, delta) {
  if (state.cart[idx]) {
    state.cart[idx].qty = Math.max(1, state.cart[idx].qty + delta);
    renderCartItems();
  }
}

function setCartQty(idx, value) {
  if (state.cart[idx]) {
    state.cart[idx].qty = Math.max(1, parseInt(value) || 1);
    renderCartItems();
  }
}

function openCheckout() {
  document.getElementById('checkoutModal').classList.add('active');
}

function closeCheckout() {
  document.getElementById('checkoutModal').classList.remove('active');
}

async function submitCheckout() {
  const name = document.getElementById('checkoutName').value.trim();
  const whatsapp = document.getElementById('checkoutWhatsApp').value.trim();
  const notes = document.getElementById('checkoutNotes').value.trim();
  
  if (!name) { alert('Por favor ingresa tu nombre'); return; }
  if (!whatsapp) { alert('Por favor ingresa tu WhatsApp'); return; }
  if (state.cart.length === 0) { alert('Tu carrito está vacío'); return; }
  
  const items = state.cart.map(c => ({
    product_id: c.product_id,
    sku: c.sku,
    name: c.name,
    qty: c.qty,
    unit_price: c.unit_price,
    subtotal: c.qty * c.unit_price,
    color: c.color,
    size: c.size
  }));
  
  const total = items.reduce((s, it) => s + it.subtotal, 0);
  
  try {
    const { data: sale, error: saleErr } = await sb.from('sales').insert({
      customer_name: name,
      customer_whatsapp: whatsapp,
      sale_date: new Date().toISOString().split('T')[0],
      payment_status: 'Pendiente',
      subtotal: total,
      total: total,
      source: 'tienda_online',
      notes: notes || null,
      stock_processed: false
    }).select().single();
    
    if (saleErr) throw saleErr;
    
    const saleItems = items.map(it => ({
      sale_id: sale.id,
      product_id: it.product_id,
      sku: it.sku,
      name: it.name,
      qty: it.qty,
      unit_price: it.unit_price,
      subtotal: it.subtotal
    }));
    
    const { error: itemsErr } = await sb.from('sale_items').insert(saleItems);
    if (itemsErr) throw itemsErr;
    
    const message = `Hola 🌸 Nuevas chicas queremos:\n\n${items.map(it => `• ${it.name} (${it.qty}x $${it.unit_price.toFixed(2)})`).join('\n')}\n\nTotal: $${total.toFixed(2)}\n\nNota: ${notes || '(sin notas)'}\n\n¡Gracias! 💕`;
    const encoded = encodeURIComponent(message);
    window.open(`https://wa.me/${whatsapp.replace(/\D/g, '')}?text=${encoded}`, '_blank');
    
    state.cart = [];
    updateCartCount();
    closeCheckout();
    closeCart();
    alert('✓ Pedido enviado por WhatsApp');
  } catch (err) {
    console.error(err);
    alert('Error: ' + err.message);
  }
}

function shareProduct(pid, name, price) {

  if (!product) return;
  
  const msg = `Mira esta pieza 🌸\n\n${name}\n$${(parseFloat(price) || 0).toFixed(2)}\n\n¿Te interesa?`;
  window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}
